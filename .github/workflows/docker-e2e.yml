name: Docker E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-deploy-test:
    name: Docker Build + Compose + Health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: test_password_for_docker_ci_only_123456
      JWT_SECRET: test_secret_for_docker_ci_only_12345678901234567890
      REDIS_PASSWORD: test_redis_password_for_docker_ci_only_123456
      ADMIN_BOOTSTRAP_PASSWORD: test_admin_password_for_docker_ci_only_123456
      SMS_PROVIDER: console
      PAYMENT_PROVIDER: simulator
      APP_URL: https://mekanix.test
      ZARINPAL_SANDBOX: false
      IDPAY_SANDBOX: false
      BACKUP_ENCRYPTION_PASSPHRASE: test_only_backup_passphrase_32_chars_minimum
      BACKUP_ADMIN_TOKEN: test_only_backup_admin_token_32_chars_minimum
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Prepare build context with PostgreSQL migrations
        run: |
          mkdir -p /tmp/mekanix-build
          rsync -a --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='db/*.db' --exclude='*.log' \
            ./ /tmp/mekanix-build/
          
          rm -rf /tmp/mekanix-build/prisma/migrations
          mkdir -p /tmp/mekanix-build/prisma/migrations/20260925000000_init
          cp prisma/migrations-postgresql/20260925000000_init/migration.sql \
             /tmp/mekanix-build/prisma/migrations/20260925000000_init/
          cp prisma/migrations-postgresql/migration_lock.toml \
             /tmp/mekanix-build/prisma/migrations/
          
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' \
            /tmp/mekanix-build/prisma/schema.prisma
          
          echo "✅ Build context prepared with PostgreSQL config"
      
      - name: Validate isolated staging Compose configuration
        run: docker compose -f docker-compose.staging.yml config > /dev/null
        env:
          DB_PASSWORD: staging_test_db_password_1234567890
          REDIS_PASSWORD: staging_test_redis_password_1234567890
          JWT_SECRET: staging_test_jwt_secret_12345678901234567890
          ADMIN_BOOTSTRAP_PASSWORD: staging_test_admin_password_123456
          APP_URL: https://staging.mekanix.test
          PAYMENT_PROVIDER: zarinpal
          ZARINPAL_MERCHANT_ID: staging-test-merchant
          ZARINPAL_SANDBOX: "true"
          IDPAY_SANDBOX: "false"
          BACKUP_ENCRYPTION_PASSPHRASE: staging_test_backup_passphrase_32_chars
          BACKUP_ADMIN_TOKEN: staging_test_backup_admin_token_32_chars

      - name: Build and start Docker Compose stack
        run: |
          cd /tmp/mekanix-build
          docker compose up -d --build
          docker compose ps
      
      - name: Wait for health check
        run: |
          echo "Waiting for app to be healthy..."
          for i in $(seq 1 90); do
            HEALTH=$(curl -s http://localhost:3000/api/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ App is healthy!"
              echo "$HEALTH" | python3 -m json.tool
              exit 0
            fi
            # Check if app container is running
            if ! docker compose -f /tmp/mekanix-build/docker-compose.yml ps app | grep -q "Up\|running"; then
              echo "❌ App container not running!"
              echo "=== App logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs app
              echo "=== Migrate logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs migrate
              exit 1
            fi
            echo "  Waiting... ($i/90)"
            sleep 2
          done
          echo "❌ App did not become healthy"
          docker compose -f /tmp/mekanix-build/docker-compose.yml logs
          exit 1
      
      - name: Verify database is PostgreSQL
        run: |
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "$HEALTH" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          db_status = d['services']['database']
          assert db_status == 'healthy', f'Database not healthy: {db_status}'
          print(f'✅ Database: {db_status}')
          "
      
      - name: Verify encrypted backup scheduler
        run: |
          cd /tmp/mekanix-build
          echo "Waiting for first encrypted backup..."
          for i in $(seq 1 60); do
            if docker compose exec -T backup-scheduler sh -c 'test -n "$(find /backups -maxdepth 1 -type f -name "*.sql.gz.gpg" -print -quit)"' 2>/dev/null; then
              docker compose exec -T backup-scheduler bun -e "const r = await fetch('http://127.0.0.1:3005/ready'); const d = await r.json(); if (!r.ok || d.lastBackupOk !== true) { console.error(d); process.exit(1); } const unauth = await fetch('http://127.0.0.1:3005/backups'); if (unauth.status !== 401) { console.error('Unauthenticated backup listing was not rejected:', unauth.status); process.exit(1); } const auth = await fetch('http://127.0.0.1:3005/backups', { headers: { Authorization: 'Bearer ' + process.env.BACKUP_ADMIN_TOKEN } }); if (!auth.ok) { console.error('Authenticated backup listing failed:', auth.status); process.exit(1); } console.log('Encrypted backup scheduler ready; authenticated listing works:', d.lastBackupAt);"
              if docker compose exec -T backup-scheduler sh -c 'find /backups -maxdepth 1 -type f -name "*.sql.gz" -print -quit | grep -q .' ; then
                echo "Plaintext backup found in encrypted production backup volume"
                exit 1
              fi
              echo "Encrypted backup created and verified"
              exit 0
            fi
            sleep 2
          done
          docker compose logs backup-scheduler
          echo "Encrypted backup was not created"
          exit 1

      - name: Test OTP flow
        run: |
          SEND_RESP=$(curl -s -X POST http://localhost:3000/api/auth/otp/send \
            -H "Content-Type: application/json" \
            -d '{"phone":"+989121234567"}')
          echo "OTP send response: $SEND_RESP"
          echo "$SEND_RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('ok') == True, f'OTP send failed: {d}'
          print('✅ OTP send works')
          "
      
      - name: Container logs (on failure)
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose logs --tail=100 || true
      
      - name: Stop containers
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose down -v || true
