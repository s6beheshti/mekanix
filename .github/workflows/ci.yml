name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint + TypeCheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: bunx prisma generate
      
      - name: Check for forbidden artifacts
        run: bash scripts/check-hygiene.sh
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Run TypeScript check
        run: bunx tsc --noEmit
      
      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: "file:./test.db"

      - name: Prepare SQLite database for browser tests
        run: bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "file:./test.db"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E
        run: bun run test:e2e
        env:
          CI: "true"
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "ci-browser-test-secret-only"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
