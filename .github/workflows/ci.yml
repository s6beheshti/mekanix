name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint + TypeCheck + Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Check for forbidden artifacts
        run: |
          echo "Checking for forbidden files..."
          FORBIDDEN=false
          
          # Check for database files
          if find . -name "*.db" -not -path "./node_modules/*" | grep -q .; then
            echo "❌ Database files found:"
            find . -name "*.db" -not -path "./node_modules/*"
            FORBIDDEN=true
          fi
          
          # Check for .env files (not .env.example)
          if find . -name ".env" -not -path "./node_modules/*" | grep -q .; then
            echo "❌ .env files found:"
            find . -name ".env" -not -path "./node_modules/*"
            FORBIDDEN=true
          fi
          
          # Check for upload/download/tool-results/backups directories
          for dir in upload download tool-results backups agent-ctx .zscripts; do
            if [ -d "$dir" ] && git ls-files --error-unmatch "$dir" 2>/dev/null; then
              echo "❌ Forbidden directory tracked: $dir"
              FORBIDDEN=true
            fi
          done
          
          if [ "$FORBIDDEN" = true ]; then
            echo ""
            echo "Forbidden artifacts found. Remove them with:"
            echo "  git rm --cached <file>"
            exit 1
          fi
          
          echo "✅ No forbidden artifacts found."
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Run TypeScript check
        run: bunx tsc --noEmit
      
      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: "file:./test.db"
