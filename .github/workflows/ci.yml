name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint + TypeCheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: bunx prisma generate
      
      - name: Check for forbidden artifacts
        run: bash scripts/check-hygiene.sh

      - name: Install GPG for encrypted backup regression tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg gzip

      - name: Validate and test encrypted backup/restore
        run: |
          bash -n scripts/backup-db.sh
          bash -n scripts/restore-db.sh
          bash -n scripts/test-backup-encryption.sh
          bash scripts/test-backup-encryption.sh
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Run TypeScript check
        run: bunx tsc --noEmit
      
      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: "file:./test.db"
