# MEKANIX — Production Docker Compose
#
# Security hardening:
# - PostgreSQL and Redis are NOT exposed to host (internal network only)
# - Redis requires password authentication
# - App binds to 127.0.0.1 only (use Caddy/nginx as reverse proxy for HTTPS)
# - Migrations run as a separate one-shot service before app starts

services:
  # Migration runner — runs once before app starts
  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/mekanix
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Encrypted daily backups. This service has no published host port.
  backup-scheduler:
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-0.5}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: Dockerfile.backup-scheduler
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - HOME=/tmp
      - GNUPGHOME=/tmp/gnupg
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD}@db:5432/mekanix
      - BACKUP_DIR=/backups
      - BACKUP_SCRIPT=/app/scripts/backup-db.sh
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-86400000}
      - BACKUP_ENCRYPTION_REQUIRED=true
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:?Set BACKUP_ENCRYPTION_PASSPHRASE}
      - BACKUP_ADMIN_TOKEN=${BACKUP_ADMIN_TOKEN:?Set BACKUP_ADMIN_TOKEN}
      - BACKUP_ALERT_WEBHOOK_URL=${BACKUP_ALERT_WEBHOOK_URL:-}
    volumes:
      - backupdata:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD}@db:5432/mekanix
      - NODE_ENV=production
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-admin}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-admin@mekanix.ir}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      - SMS_PROVIDER=${SMS_PROVIDER:?Set SMS_PROVIDER to a configured production SMS provider}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - KAVENEGAR_TEMPLATE=${KAVENEGAR_TEMPLATE:-}
      - MELIPAYAMAK_USERNAME=${MELIPAYAMAK_USERNAME:-}
      - MELIPAYAMAK_PASSWORD=${MELIPAYAMAK_PASSWORD:-}
      - MELIPAYAMAK_SENDER=${MELIPAYAMAK_SENDER:-}
      - FARAPAYAMAK_USERNAME=${FARAPAYAMAK_USERNAME:-}
      - FARAPAYAMAK_PASSWORD=${FARAPAYAMAK_PASSWORD:-}
      - FARAPAYAMAK_SENDER=${FARAPAYAMAK_SENDER:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:?Set PAYMENT_PROVIDER to zarinpal or idpay}
      - APP_URL=${APP_URL:?Set APP_URL to the public HTTPS origin}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-false}
      - IDPAY_SANDBOX=${IDPAY_SANDBOX:-false}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-}
      - IDPAY_API_KEY=${IDPAY_API_KEY:-}
      - NESHAN_API_KEY=${NESHAN_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - OSRM_API_URL=${OSRM_API_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mekanix
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - POSTGRES_DB=mekanix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekanix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No ports: — PostgreSQL is NOT exposed to host

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    # No ports: — Redis is NOT exposed to host

volumes:
  pgdata:
  redisdata:
  backupdata:
