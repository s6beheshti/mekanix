# MEKANIX — Staging Environment
# 
# Same security as production:
# - DB and Redis NOT exposed to host
# - Redis password required
# - App on 127.0.0.1:3001 only

services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/mekanix_staging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Isolated encrypted backups for staging; use a staging-only passphrase/token.
  backup-scheduler:
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-0.5}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: Dockerfile.backup-scheduler
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - HOME=/tmp
      - GNUPGHOME=/tmp/gnupg
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD}@db:5432/mekanix_staging
      - BACKUP_DIR=/backups
      - BACKUP_SCRIPT=/app/scripts/backup-db.sh
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-86400000}
      - BACKUP_ENCRYPTION_REQUIRED=true
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:?Set staging BACKUP_ENCRYPTION_PASSPHRASE}
      - BACKUP_ADMIN_TOKEN=${BACKUP_ADMIN_TOKEN:?Set staging BACKUP_ADMIN_TOKEN}
      - BACKUP_ALERT_WEBHOOK_URL=${BACKUP_ALERT_WEBHOOK_URL:-}
    volumes:
      - backupdata_staging:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD}@db:5432/mekanix_staging
      - NODE_ENV=production
      - APP_ENV=staging
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-admin}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-admin@mekanix.ir}
      - APP_URL=${APP_URL:?Set APP_URL to the staging HTTPS origin}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      - SMS_PROVIDER=console
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:?Set PAYMENT_PROVIDER to zarinpal or idpay}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-}
      - IDPAY_API_KEY=${IDPAY_API_KEY:-}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-true}
      - IDPAY_SANDBOX=${IDPAY_SANDBOX:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mekanix
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - POSTGRES_DB=mekanix_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekanix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No ports — internal only

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata_staging:/data
    restart: unless-stopped
    # No ports — internal only

volumes:
  pgdata_staging:
  redisdata_staging:
  backupdata_staging:
